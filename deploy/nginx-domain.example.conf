# Use ONLY after your FQDN has a working HTTPS certificate.
# Replace FQDN and certificate paths. Create htpasswd with:
# apt-get install apache2-utils && htpasswd -c /etc/nginx/.htpasswd_twcrawler YOUR_USER
server {
    listen 80;
    server_name FQDN;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name FQDN;
    ssl_certificate /etc/letsencrypt/live/FQDN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FQDN/privkey.pem;

    auth_basic "Telewebion private admin";
    auth_basic_user_file /etc/nginx/.htpasswd_twcrawler;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:18895;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        add_header X-Content-Type-Options nosniff always;
    }
}
